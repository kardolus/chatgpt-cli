name: test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  mod:
    runs-on: ubuntu-latest
    name: Check modules
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: 'stable'
      - uses: actions/checkout@v4
      - run: go mod tidy && git diff --exit-code go.mod go.sum

  format:
    runs-on: ubuntu-latest
    name: Check Go formatting
    needs: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: 'stable'
      - run: go fmt ./... && git diff --exit-code

  lint:
    runs-on: ubuntu-latest
    name: Lint Go code
    needs: format
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: 'stable'
      # v9 installs golangci-lint v2 (built with go1.25). v3 pulled the last v1
      # (go1.24-built), which refuses to lint this module's go1.25 target. The
      # action runs golangci-lint itself, so no separate run step is needed.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  unit-tests:
    runs-on: ubuntu-latest
    name: Run unit tests
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/unit.sh

  integration-tests:
    runs-on: ubuntu-latest
    name: Run integration tests
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/integration.sh